#
# Builds the Windows packages (setup.exe and portable ZIP) with packaging/windows/build.ps1 and
# uploads them as a workflow artifact. Started by hand (Actions → Windows build → Run workflow).
name: Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release/*
          if-no-files-found: error
